<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b1a3a">
<title>سعراتي</title>
<style>
:root{--bg:#f6f3ef;--card:#fff;--ink:#2b1a3a;--mute:#7b6f86;--acc:#ff6a2b;--line:#e6dfd8;--ok:#2f9e6b}
@media (prefers-color-scheme:dark){:root{--bg:#171020;--card:#241a31;--ink:#f3ecf8;--mute:#a597b3;--line:#3a2d49}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;padding:16px 16px 40px;max-width:520px;margin-inline:auto}
h1{font-size:22px;margin:4px 0 14px;display:flex;justify-content:space-between;align-items:center}
.gear{background:none;border:0;font-size:22px;color:var(--mute)}
.total{background:var(--ink);color:var(--bg);border-radius:20px;padding:18px;margin-bottom:14px}
.total b{font-size:44px;line-height:1}
.total small{display:block;opacity:.75;margin-top:6px}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.2);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.btn{width:100%;border:0;border-radius:16px;padding:16px;font-size:18px;font-weight:700;background:var(--acc);color:#fff;margin:6px 0}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.5}
input[type=text],input[type=password],input[type=number],select{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;margin:6px 0;font-family:inherit}
label{display:block;font-size:14px;color:var(--mute);margin-top:8px}
img.prev{width:100%;border-radius:16px;margin:8px 0;max-height:260px;object-fit:cover}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:8px 0}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.mac{color:var(--mute);font-size:13px;margin-top:4px}
.cal{font-weight:800;color:var(--acc);white-space:nowrap}
.msg{color:var(--mute);padding:10px 0;text-align:center}
.err{color:#d33}
.x{background:none;border:0;color:var(--mute);font-size:18px}
h2{font-size:16px;margin:18px 0 4px;color:var(--mute)}
.hide{display:none}
.qty{display:flex;align-items:center;gap:8px;margin-top:8px}
.qty button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:22px}
.qty span{min-width:64px;text-align:center;font-weight:700}
.rec{border:2px solid var(--ok);border-radius:16px;padding:12px;margin:10px 0;background:var(--card)}
.rec b{font-size:28px;color:var(--ok)}
.small{font-size:12px;color:var(--mute);margin-top:6px}
</style>
</head>
<body>
<h1>سعراتي <button class="gear" id="gear" aria-label="الإعدادات">⚙︎</button></h1>

<div class="total">
  <b id="sum">0</b> <span id="goalTxt">سعرة</span>
  <small id="macs">اليوم</small>
  <div class="bar"><i id="barFill"></i></div>
</div>

<div id="settings" class="card hide">
  <div><b>مفتاح Gemini API</b> (بيتحفظ على الفون بس)</div>
  <input type="password" id="key" placeholder="AIza...">

  <div style="margin-top:14px"><b>هدفك</b></div>
  <label>الهدف</label>
  <select id="goal"><option value="lose">عايز أخس</option><option value="maintain">أثبّت وزني</option><option value="gain">عايز أتخن</option></select>
  <label>النوع</label>
  <select id="sex"><option value="m">ذكر</option><option value="f">أنثى</option></select>
  <label>السن</label><input type="number" id="age" inputmode="numeric" placeholder="25">
  <label>الطول (سم)</label><input type="number" id="height" inputmode="numeric" placeholder="170">
  <label>الوزن (كجم)</label><input type="number" id="weight" inputmode="decimal" placeholder="75">
  <label>النشاط</label>
  <select id="act">
    <option value="1.2">قليل (قعدة ومكتب)</option>
    <option value="1.375">خفيف (تمرين ١-٣ أيام)</option>
    <option value="1.55">متوسط (تمرين ٣-٥ أيام)</option>
    <option value="1.725">عالي (تمرين ٦-٧ أيام)</option>
  </select>
  <button class="btn alt" id="calc">احسب الرقم المناسب لي</button>
  <div id="rec"></div>
  <label>هدفك اليومي (سعرة) - تقدر تعدّله</label>
  <input type="number" id="target" inputmode="numeric" placeholder="2000">
  <button class="btn" id="saveAll">حفظ</button>
</div>

<input type="file" id="file" accept="image/*" capture="environment" class="hide">
<button class="btn" id="snap">صوّر الأكل أو الشرب</button>
<img id="prev" class="prev hide" alt="">
<input type="text" id="note" class="hide" placeholder="ملاحظة (اختياري): ٣٣٠ ملي، بسكر، حبتين...">
<button class="btn hide" id="go">احسب السعرات</button>
<div id="status" class="msg"></div>
<div id="result"></div>

<h2>وجبات اليوم</h2>
<div id="log"></div>

<script>
const MODEL="gemini-2.5-flash"; // غيّره لو جوجل طلّعت موديل أحدث
const $=id=>document.getElementById(id);
let imgData=null, pending=null, calcTarget=null;
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const getLog=()=>store.get("log_"+today(),[]);

function render(){
  const log=getLog();
  let c=0,p=0,k=0,f=0;
  log.forEach(m=>{c+=m.cal;p+=m.p;k+=m.c;f+=m.f});
  const t=store.get("prof",{}).target;
  $("sum").textContent=Math.round(c);
  $("goalTxt").textContent=t?`من ${t} سعرة`:"سعرة";
  $("barFill").style.width=t?Math.min(100,c/t*100)+"%":"0";
  const left=t?Math.round(t-c):null;
  $("macs").textContent=(left!==null?(left>=0?`فاضل ${left} سعرة · `:`زيادة ${-left} سعرة · `):"")+`بروتين ${Math.round(p)}ج · كربوهيدرات ${Math.round(k)}ج · دهون ${Math.round(f)}ج`;
  $("log").innerHTML=log.length?"":'<div class="msg">لسه مفيش وجبات النهارده</div>';
  log.forEach((m,i)=>{
    const d=document.createElement("div");d.className="card";
    d.innerHTML=`<div class="row"><span>${esc(m.name)}</span><span class="cal">${Math.round(m.cal)}</span><button class="x" data-i="${i}">✕</button></div>`;
    $("log").appendChild(d);
  });
}
$("log").onclick=e=>{
  const i=e.target.dataset.i; if(i===undefined)return;
  const l=getLog(); l.splice(+i,1); store.set("log_"+today(),l); render();
};

function loadProf(){
  $("key").value=store.get("key","");
  const p=store.get("prof",{});
  ["goal","sex","age","height","weight","act","target"].forEach(k=>{if(p[k]!==undefined)$(k).value=p[k]});
}
$("gear").onclick=()=>{$("settings").classList.toggle("hide");loadProf()};

$("calc").onclick=()=>{
  const age=+$("age").value,h=+$("height").value,w=+$("weight").value;
  if(!age||!h||!w){$("rec").innerHTML='<div class="err">املا السن والطول والوزن الأول</div>';return}
  const bmr=10*w+6.25*h-5*age+($("sex").value==="m"?5:-161);
  const tdee=bmr*(+$("act").value);
  const g=$("goal").value;
  let t=tdee,txt="لتثبيت وزنك";
  if(g==="lose"){t=tdee-500;txt="للتخسيس بمعدل ~٠.٥ كجم في الأسبوع"}
  if(g==="gain"){t=tdee+400;txt="للزيادة بمعدل ~٠.٣-٠.٤ كجم في الأسبوع"}
  const floor=$("sex").value==="m"?1500:1200;
  let warn="";
  if(t<floor){t=floor;warn=" (رفعته للحد الأدنى الآمن)"}
  t=Math.round(t/10)*10;
  calcTarget=t;
  $("rec").innerHTML=`<div class="rec"><b>${t}</b> سعرة في اليوم<div>${txt}${warn}</div>
  <div class="small">احتياجك للتثبيت تقريباً ${Math.round(tdee/10)*10} سعرة. الأرقام تقدير بمعادلة Mifflin-St Jeor، مش بديل لدكتور أو أخصائي تغذية.</div>
  <button class="btn alt" id="useRec">استخدم الرقم ده</button></div>`;
  $("useRec").onclick=()=>{$("target").value=calcTarget};
};

$("saveAll").onclick=()=>{
  store.set("key",$("key").value.trim());
  const p={};
  ["goal","sex","age","height","weight","act"].forEach(k=>p[k]=$(k).value);
  p.target=+$("target").value||null;
  store.set("prof",p);
  $("settings").classList.add("hide");
  $("status").textContent="اتحفظت الإعدادات";
  render();
};

$("snap").onclick=()=>$("file").click();
$("file").onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const s=Math.min(1,1024/Math.max(im.width,im.height));
      const cv=document.createElement("canvas");
      cv.width=im.width*s;cv.height=im.height*s;
      cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
      const url=cv.toDataURL("image/jpeg",.85);
      imgData=url.split(",")[1];
      $("prev").src=url;
      ["prev","note","go"].forEach(i=>$(i).classList.remove("hide"));
      $("result").innerHTML="";$("status").textContent="";
    };
    im.src=r.result;
  };
  r.readAsDataURL(f);
};

$("go").onclick=async()=>{
  const key=store.get("key","");
  if(!key){$("settings").classList.remove("hide");loadProf();$("status").innerHTML='<span class="err">ضيف مفتاح Gemini الأول</span>';return}
  $("go").disabled=true;$("status").textContent="بحلل الصورة...";$("result").innerHTML="";
  const prompt=`حلل صورة الأكل/الشرب دي وقدّر السعرات. ${$("note").value?"ملاحظة المستخدم: "+$("note").value+".":""}
لو الأكل مصري أو عربي اتعرف عليه بدقة (كشري، فول، طعمية، محشي، ملوخية...). قدّر الكمية من حجم الطبق أو الكوب.
رجّع JSON فقط بالشكل ده: {"items":[{"name":"الاسم بالعربي","amount":"الكمية التقريبية","cal":رقم,"p":بروتين بالجرام,"c":كربوهيدرات بالجرام,"f":دهون بالجرام}]}
لو مفيش أكل في الصورة رجّع {"items":[]}`;
  try{
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${encodeURIComponent(key)}`,{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({contents:[{parts:[{text:prompt},{inline_data:{mime_type:"image/jpeg",data:imgData}}]}],generationConfig:{responseMimeType:"application/json"}})
    });
    const j=await r.json();
    if(!r.ok)throw new Error(j.error?.message||"خطأ من الخدمة");
    const txt=j.candidates[0].content.parts.map(p=>p.text||"").join("").replace(/```json|```/g,"").trim();
    pending=(JSON.parse(txt).items||[]).map(it=>({...it,cal:+it.cal||0,p:+it.p||0,c:+it.c||0,f:+it.f||0,m:1}));
    if(!pending.length){$("status").textContent="ما لقيتش أكل في الصورة، جرّب تصوّر أقرب";$("go").disabled=false;return}
    $("status").textContent="";showResult();
  }catch(e){$("status").innerHTML='<span class="err">'+esc(e.message)+'</span>'}
  $("go").disabled=false;
};

function showResult(){
  $("result").innerHTML="";
  let tot=0;
  pending.forEach((it,i)=>{
    const cal=it.cal*it.m;tot+=cal;
    const d=document.createElement("div");d.className="card";
    d.innerHTML=`<div class="row"><span>${esc(it.name)} <small>(${esc(it.amount)})</small></span><span class="cal">${Math.round(cal)}</span></div>
    <div class="mac">بروتين ${Math.round(it.p*it.m)}ج · كربوهيدرات ${Math.round(it.c*it.m)}ج · دهون ${Math.round(it.f*it.m)}ج</div>
    <div class="qty"><span style="color:var(--mute);font-weight:400">الكمية</span><button data-i="${i}" data-d="-0.25">−</button><span>×${+it.m.toFixed(2)}</span><button data-i="${i}" data-d="0.25">+</button><button data-i="${i}" data-del="1" style="margin-inline-start:auto">✕</button></div>`;
    $("result").appendChild(d);
  });
  const b=document.createElement("button");b.className="btn";b.textContent=`سجّل (${Math.round(tot)} سعرة)`;
  b.id="logIt";
  $("result").appendChild(b);
}
$("result").onclick=e=>{
  const t=e.target;
  if(t.dataset.i!==undefined){
    const i=+t.dataset.i;
    if(t.dataset.del){pending.splice(i,1)}
    else{pending[i].m=Math.max(0.25,pending[i].m+(+t.dataset.d))}
    if(!pending.length){$("result").innerHTML="";return}
    showResult();return;
  }
  if(t.id==="logIt"){
    const l=getLog();
    pending.forEach(it=>l.push({name:it.name,cal:it.cal*it.m,p:it.p*it.m,c:it.c*it.m,f:it.f*it.m}));
    store.set("log_"+today(),l);pending=null;
    $("result").innerHTML="";["prev","note","go"].forEach(i=>$(i).classList.add("hide"));
    $("note").value="";$("file").value="";render();
  }
};
loadProf();render();
</script>
</body>
</html>
